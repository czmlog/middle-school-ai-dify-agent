app:
  description: 面向中学信息科技教师的人工智能课程教学设计、实验单生成、项目评价与学情分析工作流。
  icon: 📋
  icon_background: '#ECFDF3'
  icon_type: emoji
  mode: workflow
  name: AI课程教学设计与评价助手（教师端）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
