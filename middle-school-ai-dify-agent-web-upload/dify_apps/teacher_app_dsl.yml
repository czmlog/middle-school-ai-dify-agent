            Markdown 表格空单元格表示。'
        - role: user
          text: '任务类型：{{#start.task_type#}}

            年级：{{#start.grade#}}

            课程主题：{{#start.topic#}}

            学生基础：{{#start.class_profile#}}

            已有材料：{{#start.materials#}}


            任务需求诊断：

            {{#task_diagnosis.text#}}


            官方依据检索结果：

            {{#official_retrieval_teacher.result#}}


