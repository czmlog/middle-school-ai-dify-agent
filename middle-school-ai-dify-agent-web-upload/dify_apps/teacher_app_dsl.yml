    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      configs: []
      enabled: false
      type: ''
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: edge-start-diagnosis
      source: start
      sourceHandle: source
      target: task_diagnosis
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: knowledge-retrieval
      id: edge-diagnosis-retrieval
      source: task_diagnosis
      sourceHandle: source
      target: official_retrieval_teacher
      targetHandle: target
      type: custom
    - data:
        sourceType: knowledge-retrieval
        targetType: llm
      id: edge-retrieval-main
      source: official_retrieval_teacher
      sourceHandle: source
      target: main_product
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: llm
      id: edge-main-evidence
      source: main_product
      sourceHandle: source
      target: evidence_plan
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: llm
      id: edge-evidence-report
      source: evidence_plan
      sourceHandle: source
      target: report_material
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: template-transform
      id: edge-report-compose
      source: report_material
      sourceHandle: source
      target: final_compose
      targetHandle: target
      type: custom
    - data:
        sourceType: template-transform
        targetType: end
      id: edge-compose-end
      source: final_compose
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
    nodes:
    - data:
        selected: false
        title: 教师输入
        type: start
        variables:
        - default: 实验单生成
          label: 任务类型
          options:
          - 实验单生成
          - 学生项目评价
          - 课堂问题归纳
          - 教学反思生成
          required: true
          type: select
          variable: task_type
        - default: 初中
          label: 年级
          max_length: 48
          required: true
          type: text-input
          variable: grade
        - default: 人工智能项目式学习
          label: 课程主题
          max_length: 120
          required: true
          type: text-input
          variable: topic
        - default: 学生已学习Python基础，了解人工智能应用案例，但对数据、模型和评价指标理解较弱。
          label: 学生基础
          max_length: 1000
          required: false
          type: paragraph
          variable: class_profile
        - default: ''
          label: 学生作品/课堂记录/已有材料
          max_length: 3000
          required: false
          type: paragraph
          variable: materials
      height: 213
      id: start
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        memory:
          window:
            enabled: false
            size: 0
        model:
          completion_params:
            max_tokens: 700
            temperature: 0.2
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '你是中学信息科技/人工智能课程的“教师任务需求诊断器”。你的任务不是生成完整教学材料，而是把教师输入转化为后续工作流可用的设计约束。


            必须严格依据教师输入，不要自行改年级、主题或课时。输出要短而准。


            固定格式：

            任务归类：

            教学场景：

            学生基础判断：

            关键困难：

            需要生成的核心产物：

            必须保留的过程证据：

            风险与边界：'
        - role: user
          text: '任务类型：{{#start.task_type#}}

            年级：{{#start.grade#}}

            课程主题：{{#start.topic#}}

            学生基础：{{#start.class_profile#}}

            已有材料：{{#start.materials#}}'
